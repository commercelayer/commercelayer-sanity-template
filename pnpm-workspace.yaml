# pnpm 11 reads its settings from here instead of the "pnpm" field in package.json.
# Dependency lifecycle scripts are blocked by default, so each one must be decided
# explicitly: esbuild needs its postinstall to link the platform binary, the others
# only print funding/greeting messages.
allowBuilds:
  esbuild: true
  core-js-pure: false
  styled-components: false
  iframe-resizer: true
  unrs-resolver: true

# Security overrides for transitive dependencies (pnpm audit). Each one is scoped to
# the vulnerable major so that it stays within semver of what the parent expects.
# Remove an entry once its parent package ships with a patched version.
overrides:
  sharp@<0.35.5: ^0.35.5
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  smol-toml@<1.8.1: ^1.8.1
  adm-zip@<0.6.1: ^0.6.1
  undici@>=7.0.0 <7.29.1: ^7.29.1
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  prismjs@<1.30.0: ^1.30.0
  dompurify@<3.4.16: ^3.4.16
